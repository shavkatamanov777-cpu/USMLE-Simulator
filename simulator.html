<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USMLE Simulyator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--bg2:#0f1420;--glass:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.08);--t1:#fff;--t2:#8b92a8;--t3:#5a6178;--cyan:#00d4ff;--green:#10b981;--red:#ef4444;--orange:#f59e0b;--grad:linear-gradient(135deg,#00d4ff,#00f5a0);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;}
.mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.mesh::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(0,212,255,0.12),transparent 70%);top:-200px;left:-200px;animation:f1 20s ease-in-out infinite;}
.mesh::after{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(124,58,237,0.1),transparent 70%);bottom:-150px;right:-150px;animation:f2 25s ease-in-out infinite;}
@keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,60px)}}
@keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-40px)}}
.header{position:sticky;top:0;background:rgba(10,14,26,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;z-index:100;}
.header-left{display:flex;align-items:center;gap:16px;}
.back{display:flex;align-items:center;gap:6px;color:var(--t2);text-decoration:none;font-size:0.85rem;font-weight:500;padding:7px 12px;border-radius:8px;transition:all 0.2s;}
.back:hover{background:var(--glass);color:var(--t1);}
.back svg{width:14px;height:14px;}
.cid{font-family:'JetBrains Mono',monospace;font-size:0.72rem;font-weight:600;color:var(--cyan);background:rgba(0,212,255,0.1);padding:5px 10px;border-radius:6px;}
.hactions{display:flex;gap:8px;}
.ibtn{width:36px;height:36px;border-radius:8px;background:var(--glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;color:var(--t2);text-decoration:none;}
.ibtn:hover{background:rgba(255,255,255,0.06);color:var(--t1);}
.ibtn.active{background:rgba(245,158,11,0.15);color:var(--orange);border-color:rgba(245,158,11,0.3);}
.ibtn svg{width:16px;height:16px;}
.layout{display:grid;grid-template-columns:1fr 380px;min-height:calc(100vh - 57px);position:relative;z-index:1;}
.cpanel{padding:28px;overflow-y:auto;max-height:calc(100vh - 57px);}
.ctitle{font-size:1.4rem;font-weight:700;margin-bottom:10px;line-height:1.3;}
.cbadges{display:flex;gap:6px;margin-bottom:24px;}
.badge{padding:4px 10px;border-radius:16px;font-size:0.68rem;font-weight:600;}
.b-cat{background:rgba(0,212,255,0.1);color:var(--cyan);}
.b-q{background:rgba(239,68,68,0.1);color:var(--red);}
.b-o{background:rgba(245,158,11,0.1);color:var(--orange);}
.isec{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;}
.isec h3{font-size:0.9rem;font-weight:600;color:var(--cyan);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.isec h3 svg{width:16px;height:16px;}
.irow{display:flex;justify-content:space-between;padding:8px 0;font-size:0.85rem;border-bottom:1px solid var(--border);}
.irow:last-child{border-bottom:none;}
.irow .l{color:var(--t2);}
.irow .v{color:var(--t1);font-weight:600;text-align:right;max-width:60%;}
.osec{margin-top:28px;}
.osec h3{font-size:1.05rem;font-weight:700;margin-bottom:14px;}
.ocont{display:flex;gap:8px;margin-bottom:10px;align-items:stretch;}
.obtn{flex:1;text-align:left;background:var(--bg2);border:2px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--t1);font-size:0.88rem;cursor:pointer;transition:all 0.2s;line-height:1.5;}
.obtn:hover:not(:disabled){background:rgba(0,212,255,0.06);border-color:rgba(0,212,255,0.3);transform:translateX(3px);}
.obtn.correct{background:rgba(16,185,129,0.12)!important;border-color:var(--green)!important;color:var(--green)!important;}
.obtn.wrong{background:rgba(239,68,68,0.12)!important;border-color:var(--red)!important;color:var(--red)!important;}
.ebtn{background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.2);color:var(--cyan);width:40px;border-radius:8px;cursor:pointer;font-size:1.1rem;font-weight:700;transition:all 0.2s;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ebtn:hover{background:rgba(0,212,255,0.2);}
.ebox{background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.15);border-radius:14px;padding:20px;margin-top:16px;display:none;}
.ebox h4{color:var(--green);margin-bottom:10px;font-size:0.95rem;}
.ebox.wrong{background:rgba(239,68,68,0.06);border-color:rgba(239,68,68,0.15);}
.ebox.wrong h4{color:var(--red);}
.ebox p{font-size:0.88rem;line-height:1.7;color:var(--t2);}
.navbtns{display:flex;gap:10px;margin-top:28px;}
.nbtn{background:var(--glass);color:var(--t1);border:1px solid var(--border);padding:10px 20px;border-radius:8px;cursor:pointer;font-size:0.85rem;font-weight:600;text-decoration:none;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px;}
.nbtn:hover{background:rgba(255,255,255,0.06);}
.nbtn svg{width:14px;height:14px;}
.chat{background:rgba(10,14,26,0.6);backdrop-filter:blur(20px);border-left:1px solid var(--border);display:flex;flex-direction:column;height:calc(100vh - 57px);position:sticky;top:57px;}
.chat-head{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:0.95rem;display:flex;align-items:center;gap:8px;}
.chat-head svg{width:18px;height:18px;color:var(--cyan);}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.msg{max-width:90%;padding:10px 14px;border-radius:12px;font-size:0.85rem;line-height:1.6;white-space:pre-wrap;}
.msg-u{align-self:flex-end;background:var(--grad);color:#0a0e1a;border-bottom-right-radius:4px;font-weight:500;}
.msg-a{align-self:flex-start;background:var(--glass);color:var(--t1);border-bottom-left-radius:4px;}
.msg-s{align-self:center;background:rgba(255,255,255,0.03);color:var(--t3);font-size:0.75rem;padding:6px 14px;border-radius:16px;}
.chat-in{padding:14px;border-top:1px solid var(--border);display:flex;gap:8px;}
.chat-in input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--t1);font-size:0.85rem;outline:none;font-family:inherit;}
.chat-in input:focus{border-color:var(--cyan);}
.chat-in button{background:var(--grad);color:#0a0e1a;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:0.85rem;font-weight:700;}
.chat-in button:disabled{opacity:0.5;cursor:not-allowed;}
.loading{color:var(--t3);text-align:center;padding:60px;}
.typing{display:flex;gap:4px;padding:6px;}
.typing span{width:7px;height:7px;background:var(--t3);border-radius:50%;animation:bounce 1.4s infinite;}
.typing span:nth-child(2){animation-delay:0.2s;}
.typing span:nth-child(3){animation-delay:0.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.modal{display:none;position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);}
.modal-c{background:linear-gradient(135deg,#0f1420,#151b2e);margin:10% auto;padding:28px;border:1px solid var(--border);border-radius:16px;width:90%;max-width:650px;max-height:70vh;overflow-y:auto;}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.modal-h h3{color:var(--cyan);font-size:1.1rem;}
.xbtn{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:var(--red);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1.3rem;font-weight:700;}
.modal-b{color:var(--t2);line-height:1.8;font-size:0.92rem;}
@media(max-width:1000px){.layout{grid-template-columns:1fr;}.chat{height:50vh;border-left:none;border-top:1px solid var(--border);}}
</style>
</head>
<body>
<div class="mesh"></div>
<div class="header">
<div class="header-left">
<a href="/index.html" class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Dashboard</a>
<span class="cid" id="cid">CASE #01</span>
</div>
<div class="hactions">
<button class="ibtn" id="bmBtn" onclick="toggleBM()" title="Bookmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
<a class="ibtn" href="/flashcards.html" title="Flashcards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></a>
</div>
</div>
<div class="layout">
<div class="cpanel" id="cp"><div class="loading">Yuklanmoqda...</div></div>
<div class="chat">
<div class="chat-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>AI Professor</div>
<div class="chat-msgs" id="msgs"><div class="msg msg-s">Keys yuklangandan keyin savol bering</div></div>
<div class="chat-in"><input type="text" id="ci" placeholder="Savolingizni yozing..." disabled><button id="sb" onclick="send()" disabled>Yuborish</button></div>
</div>
</div>
<div id="modal" class="modal"><div class="modal-c"><div class="modal-h"><h3 id="mt">Izoh</h3><button class="xbtn" onclick="closeM()">×</button></div><div class="modal-b" id="mb"></div></div></div>
<script>
let cur=null,ans=false;
const id=parseInt(new URLSearchParams(location.search).get('id'))||1;
fetch('/cases.json').then(r=>r.json()).then(d=>{cur=d.cases.find(c=>c.id===id);if(!cur){document.getElementById('cp').innerHTML='<div class="loading">Keys topilmadi</div>';return;}render(cur);document.getElementById('ci').disabled=false;document.getElementById('sb').disabled=false;document.getElementById('cid').textContent='CASE #'+String(cur.id).padStart(2,'0');document.getElementById('msgs').innerHTML=`<div class="msg msg-s">"${cur.title}" bo'yicha savol bering</div>`;updateBM();});
function render(c){const dc=c.difficulty==='Qiyin'?'b-q':'b-o';let vh='',lh='';for(const[k,v]of Object.entries(c.vitals))vh+=`<div class="irow"><span class="l">${k.replace(/_/g,' ')}</span><span class="v">${v}</span></div>`;for(const[k,v]of Object.entries(c.labs))lh+=`<div class="irow"><span class="l">${k.replace(/_/g,' ')}</span><span class="v">${v}</span></div>`;let oh='';c.options.forEach((o,i)=>{const he=c.option_explanations&&c.option_explanations[i];oh+=`<div class="ocont"><button class="obtn" onclick="check(${i},this)">${String.fromCharCode(65+i)}. ${o}</button>${he?`<button class="ebtn" onclick="showE(${i})">?</button>`:''}</div>`;});document.getElementById('cp').innerHTML=`<div class="ctitle">${c.title}</div><div class="cbadges"><span class="badge b-cat">${c.category}</span><span class="badge ${dc}">${c.difficulty}</span></div><div class="isec"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Bemor</h3><div class="irow"><span class="l">Ism</span><span class="v">${c.patient.name}</span></div><div class="irow"><span class="l">Yosh</span><span class="v">${c.patient.age}</span></div><div class="irow"><span class="l">Vazn</span><span class="v">${c.patient.weight}</span></div><div class="irow"><span class="l">Shikoyat</span><span class="v">${c.patient.chief_complaint}</span></div></div><div class="isec"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Vital ko'rsatkichlar</h3>${vh}</div><div class="isec"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Laboratoriya</h3>${lh}</div><div class="osec"><h3>Javob variantlarini tanlang:</h3>${oh}</div><div class="ebox" id="ebox"><h4>To'g'ri tashxis: ${c.correct_diagnosis}</h4><p>${c.explanation}</p></div><div class="navbtns">${c.id>1?`<a class="nbtn" href="/simulator.html?id=${c.id-1}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Oldingi</a>`:''}${c.id<21?`<a class="nbtn" href="/simulator.html?id=${c.id+1}">Keyingi<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>`:''}</div>`;}
function showE(i){if(!cur.option_explanations||!cur.option_explanations[i])return;document.getElementById('mt').textContent='Variant '+String.fromCharCode(65+i)+' izohi';document.getElementById('mb').textContent=cur.option_explanations[i];document.getElementById('modal').style.display='block';}
function closeM(){document.getElementById('modal').style.display='none';}
window.onclick=e=>{if(e.target===document.getElementById('modal'))closeM();};
function check(s,btn){if(ans)return;ans=true;const c=cur.correct_option_index;document.querySelectorAll('.obtn').forEach((b,i)=>{b.disabled=true;if(i===c)b.classList.add('correct');if(i===s&&i!==c)b.classList.add('wrong');});const ok=s===c;const box=document.getElementById('ebox');box.style.display='block';if(!ok){box.classList.add('wrong');box.querySelector('h4').textContent='Noto\'g\'ri! To\'g\'ri: '+cur.correct_diagnosis;}const p=JSON.parse(localStorage.getItem('usmle_progress')||'{}');p[cur.id]={correct:ok,category:cur.category,time:Date.now()};localStorage.setItem('usmle_progress',JSON.stringify(p));}
function toggleBM(){const bm=JSON.parse(localStorage.getItem('usmle_bookmarks')||'[]');const i=bm.indexOf(cur.id);if(i>-1)bm.splice(i,1);else bm.push(cur.id);localStorage.setItem('usmle_bookmarks',JSON.stringify(bm));updateBM();}
function updateBM(){const bm=JSON.parse(localStorage.getItem('usmle_bookmarks')||'[]');const btn=document.getElementById('bmBtn');if(bm.includes(cur.id)){btn.classList.add('active');btn.querySelector('svg').setAttribute('fill','currentColor');}else{btn.classList.remove('active');btn.querySelector('svg').setAttribute('fill','none');}}
function send(){const inp=document.getElementById('ci');const t=inp.value.trim();if(!t||!cur)return;const m=document.getElementById('msgs');m.innerHTML+=`<div class="msg msg-u">${t.replace(/</g,'&lt;')}</div>`;inp.value='';const tid='t'+Date.now();m.innerHTML+=`<div class="msg msg-a" id="${tid}"><div class="typing"><span></span><span></span><span></span></div></div>`;m.scrollTop=m.scrollHeight;document.getElementById('sb').disabled=true;const ctx=`Keys: ${cur.title}\nBemor: ${cur.patient.name}, ${cur.patient.age}\nShikoyat: ${cur.patient.chief_complaint}\nVitals: ${JSON.stringify(cur.vitals)}\nLabs: ${JSON.stringify(cur.labs)}\nTashxis: ${cur.correct_diagnosis}\nIzoh: ${cur.explanation}`;fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,context:ctx})}).then(r=>r.json()).then(d=>{const el=document.getElementById(tid);if(d.response)el.textContent=d.response;else{el.textContent='Xato: '+(d.error||'');el.style.color='#ef4444';}m.scrollTop=m.scrollHeight;const ch=parseInt(localStorage.getItem('usmle_ai_chats')||'0')+1;localStorage.setItem('usmle_ai_chats',ch.toString());}).catch(e=>{document.getElementById(tid).textContent='Xato: '+e.message;document.getElementById(tid).style.color='#ef4444';}).finally(()=>{document.getElementById('sb').disabled=false;});}
document.getElementById('ci').addEventListener('keypress',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>
