<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards — CardioPed Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0a0e1a; --glass:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.08); --t1:#fff; --t2:#8b92a8; --t3:#5a6178; --cyan:#00d4ff; --teal:#00f5a0; --grad:linear-gradient(135deg,#00d4ff,#00f5a0); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--t1); min-height:100vh; display:flex; flex-direction:column; align-items:center; }
        .mesh { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
        .mesh::before { content:''; position:absolute; width:600px; height:600px; background:radial-gradient(circle,rgba(0,212,255,0.12),transparent 70%); top:-200px; left:-200px; }
        .mesh::after { content:''; position:absolute; width:500px; height:500px; background:radial-gradient(circle,rgba(124,58,237,0.1),transparent 70%); bottom:-150px; right:-150px; }
        .header { width:100%; background:rgba(10,14,26,0.85); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:14px 28px; display:flex; align-items:center; justify-content:space-between; z-index:10; position:relative; }
        .back { display:flex; align-items:center; gap:6px; color:var(--t2); text-decoration:none; font-size:0.85rem; font-weight:500; padding:7px 12px; border-radius:8px; transition:all 0.2s; }
        .back:hover { background:var(--glass); color:var(--t1); }
        .back svg { width:14px; height:14px; }
        h1 { font-size:1.1rem; font-weight:700; background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .counter { font-family:'JetBrains Mono',monospace; font-size:0.85rem; color:var(--t2); }
        .container { position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; width:100%; max-width:700px; }
        .card-scene { width:100%; max-width:560px; height:380px; perspective:1200px; margin-bottom:32px; cursor:pointer; }
        .card-inner { width:100%; height:100%; position:relative; transition:transform 0.6s cubic-bezier(0.4,0,0.2,1); transform-style:preserve-3d; }
        .card-inner.flipped { transform:rotateY(180deg); }
        .card-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:20px; padding:36px; display:flex; flex-direction:column; justify-content:center; border:1px solid var(--border); }
        .card-front { background:linear-gradient(135deg,rgba(0,212,255,0.06),rgba(124,58,237,0.06)); }
        .card-back { background:linear-gradient(135deg,rgba(16,185,129,0.06),rgba(0,212,255,0.06)); transform:rotateY(180deg); }
        .card-label { font-size:0.7rem; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:var(--cyan); margin-bottom:16px; }
        .card-back .card-label { color:var(--teal); }
        .card-text { font-size:1.1rem; font-weight:600; line-height:1.6; }
        .card-hint { margin-top:auto; padding-top:20px; font-size:0.75rem; color:var(--t3); text-align:center; }
        .controls { display:flex; gap:12px; align-items:center; }
        .cbtn { width:48px; height:48px; border-radius:12px; background:var(--glass); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s; color:var(--t2); }
        .cbtn:hover { background:rgba(255,255,255,0.06); color:var(--t1); transform:translateY(-2px); }
        .cbtn svg { width:20px; height:20px; }
        .cbtn-main { width:56px; height:56px; background:var(--grad); color:#0a0e1a; border:none; box-shadow:0 6px 20px rgba(0,212,255,0.3); }
        .cbtn-main:hover { box-shadow:0 10px 30px rgba(0,212,255,0.4); }
        .progress-dots { display:flex; gap:6px; margin-bottom:24px; flex-wrap:wrap; justify-content:center; }
        .dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.1); transition:all 0.3s; }
        .dot.active { background:var(--cyan); box-shadow:0 0 8px rgba(0,212,255,0.5); }
        .dot.done { background:var(--teal); }
    </style>
</head>
<body>
    <div class="mesh"></div>
    <div class="header">
        <a href="/index.html" class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Dashboard</a>
        <h1>Flashcards</h1>
        <span class="counter" id="counter">1 / 20</span>
    </div>
    <div class="container">
        <div class="progress-dots" id="dots"></div>
        <div class="card-scene" onclick="flip()">
            <div class="card-inner" id="cardInner">
                <div class="card-face card-front">
                    <div class="card-label">Klinik Vignette</div>
                    <div class="card-text" id="frontText">Yuklanmoqda...</div>
                    <div class="card-hint">Javobni ko'rish uchun bosing</div>
                </div>
                <div class="card-face card-back">
                    <div class="card-label">Javob va Izoh</div>
                    <div class="card-text" id="backText">...</div>
                    <div class="card-hint">Qaytish uchun bosing</div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button class="cbtn" onclick="prev()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <button class="cbtn cbtn-main" onclick="flip()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
            <button class="cbtn" onclick="next()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
    </div>
    <script>
        let cases=[], idx=0;
        fetch('/cases.json').then(r=>r.json()).then(d=>{
            cases=d.cases;
            renderDots();
            showCard();
        });
        function renderDots(){
            const el=document.getElementById('dots');
            el.innerHTML=cases.map((_,i)=>`<div class="dot ${i===0?'active':''}" id="dot${i}"></div>`).join('');
        }
        function showCard(){
            const c=cases[idx];
            document.getElementById('frontText').textContent=`${c.patient.name}, ${c.patient.age}. ${c.patient.chief_complaint}`;
            document.getElementById('backText').textContent=`${c.correct_diagnosis}\n\n${c.explanation}`;
            document.getElementById('counter').textContent=`${idx+1} / ${cases.length}`;
            document.getElementById('cardInner').classList.remove('flipped');
            document.querySelectorAll('.dot').forEach((d,i)=>{ d.classList.remove('active'); if(i===idx) d.classList.add('active'); });
        }
        function flip(){ document.getElementById('cardInner').classList.toggle('flipped'); }
        function next(){ idx=(idx+1)%cases.length; showCard(); }
        function prev(){ idx=(idx-1+cases.length)%cases.length; showCard(); }
        document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') prev(); if(e.key===' ') { e.preventDefault(); flip(); } });
    </script>
</body>
</html>
